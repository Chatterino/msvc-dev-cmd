name: msvc-dev-cmd

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
      - name: Enable Developer Command Prompt (amd64)
        uses: ./
        with:
          arch: amd64
      - name: Compile and run some C code (amd64)
        shell: cmd
        run: |
          cl.exe hello.c
          hello.exe
      - name: Enable Developer Command Prompt (amd64_x86)
        uses: ./
        with:
          arch: amd64_x86
      - name: Compile and run some C code (x86)
        shell: cmd
        run: |
          cl.exe hello.c
          hello.exe
      - name: Enable Developer Command Prompt (amd64_arm64)
        uses: ./
        with:
          arch: amd64_arm64
      - name: Compile some C code (arm64)
        shell: cmd
        run: |
          cl.exe hello.c
          dumpbin /headers hello.exe
  alias-arch:
    runs-on: windows-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
      - name: Enable Developer Command Prompt
        uses: ./
        with:
          arch: Win32
      - name: Compile and run some C code
        shell: cmd
        run: |
          cl.exe hello.c
          hello.exe
