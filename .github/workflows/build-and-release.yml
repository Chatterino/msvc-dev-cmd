name: msvc-dev-cmd

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Developer Command Prompt (amd64)
        uses: $/
        with:
          arch: amd64
      - name: Compile and run some C code (amd64)
        shell: pwsh
        run: |
          cl.exe hello.c
          ./hello.exe
      - name: Enable Developer Command Prompt (amd64_x86)
        uses: $/
        with:
          arch: amd64_x86
      - name: Compile and run some C code (x86)
        shell: pwsh
        run: |
          cl.exe hello.c
          ./hello.exe
      - name: Enable Developer Command Prompt (amd64_arm64)
        uses: $/
        with:
          arch: amd64_arm64
      - name: Compile some C code (arm64)
        shell: pwsh
        run: |
          cl.exe hello.c
          dumpbin /headers hello.exe
  alias-arch:
    runs-on: windows-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Developer Command Prompt
        uses: $/
        with:
          arch: Win32
      - name: Compile and run some C code
        shell: pwsh
        run: |
          cl.exe hello.c
          ./hello.exe
